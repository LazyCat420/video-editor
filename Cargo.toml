[package]
name = "video-editor"
version = "0.1.0"
# Shipped as a Windows installer (scripts/package-release.sh), never to crates.io;
# keeps cargo-deny's `licenses.private.ignore` from demanding a license field.
publish = false
edition = "2021"
authors = ["LazyCat420"]
description = "A lightweight, performant Rust video editor for low-spec computers"

[dependencies]
# UI Framework (Lightweight immediate-mode GUI with OpenGL / software fallback)
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "x11",
] }
egui = "0.29.1"

# Image processing for thumbnails / video preview frames
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg"] }

# Native file pickers (Import media, Export video)
rfd = "0.14.1"

# Async runtime & background workers
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros", "time", "process", "fs", "io-util"] }
crossbeam-channel = "0.5.13"

# Continuous stream primitives (already transitively resolved; direct for Mutex use)
parking_lot = "0.12"

# Serialization / Deserialization for project state (.vproj)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# Utilities
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Real-time music playback in the preview (music track only; video-embedded
# audio still requires the export). Optional so a cross-build fight with
# cpal/WASAPI can be sidestepped with --no-default-features.
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-mp3",
    "symphonia-wav",
    "symphonia-flac",
    "symphonia-vorbis",
    "symphonia-aac",
    "symphonia-isomp4",
], optional = true }

[features]
default = ["audio-playback"]
audio-playback = ["dep:rodio"]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Tooling standard 2026-11-17: mirrors the drift-king engine `[workspace.lints]`
# table (games/drift-king/engine/Cargo.toml) at warn level. Baseline warning
# counts: clippy-baseline.txt; promote warn -> deny only at zero.
[lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Hand-picked pedantic subset: catches real bugs, not style.
cast_lossless = "warn"
cast_possible_truncation = "warn"
float_cmp = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"

